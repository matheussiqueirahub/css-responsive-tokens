<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2ff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="rgba(15,23,42,0.2)"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <g>
    <rect x="120" y="80" width="960" height="100" rx="12" fill="rgba(15,23,42,0.85)"/>
    <text x="600" y="140" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="36" text-anchor="middle">
      Exemplo: Variáveis CSS Responsivas
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="230" width="760" height="170" rx="18" fill="#ffffff"/>
    <rect x="220" y="430" width="760" height="170" rx="18" fill="#ffffff"/>
  </g>

  <text x="260" y="285" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="28">
    Instruções
  </text>
  <text x="260" y="330" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    • Ajuste variáveis CSS para fontes e espaçamentos.
  </text>
  <text x="260" y="360" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    • Observe o comportamento dinâmico em diferentes larguras.
  </text>

  <text x="260" y="485" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="28">
    O que observar
  </text>
  <text x="260" y="530" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    • Tipografia e espaçamento escalonam com as media queries.
  </text>
  <text x="260" y="560" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="20">
    • Layout centralizado com áreas em destaque.
  </text>

  <g transform="translate(900, 700)">
    <rect x="-140" y="-45" width="260" height="60" rx="30" fill="#0f172a"/>
    <text x="-10" y="-10" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" text-anchor="middle">
      Breakpoints 768px & 1024px
    </text>
  </g>
</svg>
